name: shoppulse_mobile
description: ShopPulse technician app — thin Android wrapper around the web-based technician app (mandatory live camera + GPS proof-of-work capture ships and updates via the website, not this APK).
publish_to: 'none'
version: 0.2.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0
  webview_flutter_android: ^3.16.0
  image_picker: ^1.1.2
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
